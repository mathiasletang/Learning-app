<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="description" content="Cours avancés — application personnelle d'apprentissage." />

    <!-- PWA / iPad -->
    <meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cours avancés" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Cours avancés — apprentissage</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter le flash.
      (function () {
        try {
          var t = localStorage.getItem('atelier.theme');
          if (!t || t === 'auto') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
