# Configuration Netlify — build et publication automatiques de l'Atelier.
# Netlify lance la commande de build à chaque poussée sur main et sert le
# dossier dist/. Aucune configuration manuelle à faire côté tableau de bord.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# L'emploi du temps ADE, lu par la fonction `netlify/functions/edt.mjs`.
#
# Une redirection directe vers ADE remplissait le même office, mais quand elle
# échouait le navigateur n'annonçait qu'un « Failed to fetch » muet. La
# fonction, elle, renvoie la raison de la panne en clair — c'est ce texte que
# le bandeau du planning affiche.
#
# Cette règle doit précéder le filet SPA : Netlify applique la première qui
# correspond, et « /* » avale tout. `src/core/edt.ts` lit « /edt.ics » ;
# `vite.config.ts` relaie la même adresse en développement, en la relisant
# dans la fonction — une seule copie du lien.
[[redirects]]
  from = "/edt.ics"
  to = "/.netlify/functions/edt"
  status = 200
  force = true

# Filet SPA : toute route inconnue retombe sur index.html (les fichiers
# existants, dont les assets et le service worker, restent servis en priorité).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
