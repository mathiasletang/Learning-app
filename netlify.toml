# Configuration Netlify — build et publication automatiques de l'Atelier.
# Netlify lance la commande de build à chaque poussée sur main et sert le
# dossier dist/. Aucune configuration manuelle à faire côté tableau de bord.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# L'emploi du temps ADE, relayé par le site.
#
# Deux raisons, et la première suffit : le serveur de l'université n'autorise
# pas la lecture depuis une autre origine (pas d'en-tête CORS), donc le
# navigateur refuserait le fichier si l'application allait le chercher
# elle-même. La seconde est un bénéfice : l'adresse personnelle du flux, avec
# son jeton, reste ici et ne part pas dans le paquet JavaScript.
#
# Cette règle doit précéder le filet SPA : Netlify applique la première qui
# correspond, et « /* » avale tout.
#
# `src/core/edt.ts` lit « /edt.ics » ; `vite.config.ts` relaie la même adresse
# en développement, en la relisant dans ce fichier — une seule copie du lien.
[[redirects]]
  from = "/edt.ics"
  to = "https://ade25-edt.ut-capitole.fr/jsp/custom/modules/plannings/anonymous_cal.jsp?data=85e44687e1f9f3bce466d6b763250e02ea8788bf661273b6eea88f88eea8b2ba2272ddeda3f0d6d2186b3007f886e39664a45b4b3d24fa442cda746606522eeb1734c074be874daa5e596df0122d69ceb6dae3922da8827f3c5f88c4ff251c2214a1e096c86a8c4438f46ca9703c81ad,1"
  status = 200
  force = true

# Filet SPA : toute route inconnue retombe sur index.html (les fichiers
# existants, dont les assets et le service worker, restent servis en priorité).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
